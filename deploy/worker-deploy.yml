apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: worker
  name: worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  strategy: 
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - image: aghilesgh/dockercoins-worker:1.0.1
        name: dockercoins-worker
